<svg width="240" height="240" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="starAmbient" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="starGradient" x1="60" y1="60" x2="140" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFA240" />
      <stop offset="35%" stop-color="#FF631C" />
      <stop offset="100%" stop-color="#DC3B00" />
    </linearGradient>
  </defs>

  <!-- Crosshair axes (extending past outer dotted circle) -->
  <line x1="100" y1="30" x2="100" y2="170" stroke="#FF5C14" stroke-width="1.2" stroke-opacity="0.85" />
  <line x1="30" y1="100" x2="170" y2="100" stroke="#FF5C14" stroke-width="1.2" stroke-opacity="0.85" />

  <!-- Diagonal rays (45 degrees) -->
  <line x1="56" y1="56" x2="144" y2="144" stroke="#FF5C14" stroke-width="1.1" stroke-opacity="0.75" />
  <line x1="144" y1="56" x2="56" y2="144" stroke="#FF5C14" stroke-width="1.1" stroke-opacity="0.75" />

  <!-- Outer Dotted Circle (r=60) -->
  <circle cx="100" cy="100" r="60" stroke="#FF5C14" stroke-width="1.1" stroke-dasharray="1.5 4.5" stroke-opacity="0.7" />

  <!-- Inner Solid Circle (r=40) -->
  <circle cx="100" cy="100" r="40" stroke="#FF5C14" stroke-width="1.2" stroke-opacity="0.85" />

  <!-- Center 4-Pointed Radiant Flare Star -->
  <path d="M 100 58 Q 100 100 142 100 Q 100 100 100 142 Q 100 100 58 100 Q 100 100 100 58 Z"
        fill="url(#starGradient)"
        filter="url(#starAmbient)" />
</svg>

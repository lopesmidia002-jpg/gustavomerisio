<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Radiant Fire Gradient -->
    <linearGradient id="starGradient" x1="60" y1="60" x2="140" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFA83B" />
      <stop offset="35%" stop-color="#FF5514" />
      <stop offset="100%" stop-color="#D43000" />
    </linearGradient>

    <!-- Crisp Subtle Glow (refined, not blurry) -->
    <filter id="starGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Crosshair axes (extending past outer dotted circle) -->
  <line x1="100" y1="12" x2="100" y2="188" stroke="#FF5514" stroke-width="1.2" stroke-opacity="0.85" />
  <line x1="12" y1="100" x2="188" y2="100" stroke="#FF5514" stroke-width="1.2" stroke-opacity="0.85" />

  <!-- Diagonal rays (45 degrees) -->
  <line x1="42" y1="42" x2="158" y2="158" stroke="#FF5514" stroke-width="1.1" stroke-opacity="0.75" />
  <line x1="158" y1="42" x2="42" y2="158" stroke="#FF5514" stroke-width="1.1" stroke-opacity="0.75" />

  <!-- Outer Dotted Circle (r=62) -->
  <circle cx="100" cy="100" r="62" stroke="#FF5514" stroke-width="1.1" stroke-dasharray="2 4.5" stroke-opacity="0.70" />

  <!-- Inner Solid Circle (r=42) -->
  <circle cx="100" cy="100" r="42" stroke="#FF5514" stroke-width="1.2" stroke-opacity="0.85" />

  <!-- Center 4-Pointed Slender Radiant Flare Star -->
  <path d="M 100 48 C 100 84 84 100 48 100 C 84 100 100 116 100 152 C 100 116 116 100 152 100 C 116 100 100 84 100 48 Z"
        fill="url(#starGradient)"
        filter="url(#starGlow)" />
</svg>

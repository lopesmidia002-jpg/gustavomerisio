<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" preserveAspectRatio="none">
  <defs>
    <!-- Satin dark espresso / charcoal gradient fill -->
    <linearGradient id="canopyFill" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#261209" stop-opacity="0.96" />
      <stop offset="40%" stop-color="#150905" stop-opacity="0.88" />
      <stop offset="85%" stop-color="#0B0604" stop-opacity="0.96" />
      <stop offset="100%" stop-color="#070403" stop-opacity="0.99" />
    </linearGradient>

    <!-- Warm top radial ember glow -->
    <radialGradient id="topEmberGlow" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#FF4B19" stop-opacity="0.30" />
      <stop offset="35%" stop-color="#C23005" stop-opacity="0.10" />
      <stop offset="70%" stop-color="#801E02" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Canopy body -->
  <polygon points="0,0 1000,0 880,450 120,450" fill="url(#canopyFill)" />
  <polygon points="0,0 1000,0 880,450 120,450" fill="url(#topEmberGlow)" />

  <!-- Slanted side borders and bottom connecting border -->
  <polyline points="0,0 120,450 880,450 1000,0" fill="none" stroke="rgba(255, 75, 25, 0.22)" stroke-width="1.2" vector-effect="non-scaling-stroke" />

  <!-- Crisp 1px warm amber bottom line highlight -->
  <line x1="120" y1="450" x2="880" y2="450" stroke="rgba(255, 75, 25, 0.40)" stroke-width="1.5" vector-effect="non-scaling-stroke" />
</svg>
